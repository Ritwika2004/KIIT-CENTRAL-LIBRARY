<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIIT Central Library - Student Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        h1 {
            text-align: center;
            font-weight: bold;
            text-decoration: underline;
        }
        marquee {
            background-color: green;
            color: white;
            padding: 10px;
            font-size: 18px;
            font-weight: bold;
        }
        form {
            width: 60%;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: #f9f9f9;
        }
        fieldset {
            margin-bottom: 20px;
        }
        legend {
            font-weight: bold;
        }
        label {
            display: inline-block;
            width: 200px;
            margin-bottom: 10px;
        }
        input, select, textarea {
            width: calc(100% - 220px);
            padding: 5px;
            margin-bottom: 10px;
        }
        textarea {
            resize: none;
        }
        .form-group {
            display: flex;
            align-items: center;
        }
        .form-group label {
            width: auto;
            margin-right: 10px;
        }
        .form-group input {
            width: auto;
        }
        .submit-btn {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        .submit-btn:hover {
            background-color: darkgreen;
        }
        .kiit-logo {
            float: right;
            margin-top: -80px;
        }
    </style>
    <script>
        function handleSubmit(event) {
            event.preventDefault();
            const firstName = document.getElementById('first-name').value;
            const middleName = document.getElementById('middle-name').value;
            const lastName = document.getElementById('last-name').value;
            const email = document.getElementById('email').value;
            const address = document.getElementById('correspondence-address').value;

            alert(`Full Name: ${firstName} ${middleName} ${lastName}\nUser Email: ${email}\nStudent Address: ${address}`);
        }
    </script>
</head>
<body>
    <h1>KIIT Central Library</h1>
    <img src="https://kiit.ac.in/downloads/kiit-logo.png" alt="KIIT Logo" class="kiit-logo" width="150">

    <marquee direction="left">Student Registration Form</marquee>

    <form onsubmit="handleSubmit(event)">
        <fieldset>
            <legend>Student Details</legend>

            <div class="form-group">
                <label for="first-name"><b>First Name:</b></label>
                <input type="text" id="first-name" name="first-name" required>

                <label for="middle-name"><b>Middle Name:</b></label>
                <input type="text" id="middle-name" name="middle-name">

                <label for="last-name"><b>Last Name:</b></label>
                <input type="text" id="last-name" name="last-name" required>
            </div>

            <label for="email"><i>Email:</i></label>
            <input type="email" id="email" name="email" required>

            <label for="password"><i>Password:</i></label>
            <input type="password" id="password" name="password" required>

            <label for="confirm-password"><i>Confirm your password:</i></label>
            <input type="password" id="confirm-password" name="confirm-password" required>

            <label><b>Gender:</b></label>
            <input type="radio" id="male" name="gender" value="Male" required> Male
            <input type="radio" id="female" name="gender" value="Female"> Female
            <input type="radio" id="others" name="gender" value="Others"> Others

            <label for="correspondence-address"><b>Enter your Correspondence Address:</b></label>
            <textarea id="correspondence-address" name="correspondence-address" rows="4">Correspondence Address</textarea>

            <label for="permanent-address"><b>Enter your Permanent Address:</b></label>
            <textarea id="permanent-address" name="permanent-address" rows="4">Permanent Address</textarea>

            <label for="domicile"><strong>Domicile:</strong></label>
            <select id="domicile" name="domicile" required>
                <optgroup label="East">
                    <option value="Odisha">Odisha</option>
                    <option value="West Bengal">West Bengal</option>
                    <option value="Jharkhand">Jharkhand</option>
                    <option value="Bihar">Bihar</option>
                </optgroup>
                <optgroup label="North">
                    <option value="Punjab">Punjab</option>
                    <option value="Haryana">Haryana</option>
                    <option value="Uttar Pradesh">Uttar Pradesh</option>
                </optgroup>
                <optgroup label="South">
                    <option value="Andhra Pradesh">Andhra Pradesh</option>
                    <option value="Telangana">Telangana</option>
                </optgroup>
                <optgroup label="West">
                    <option value="Maharashtra">Maharashtra</option>
                    <option value="Gujarat">Gujarat</option>
                </optgroup>
            </select>
        </fieldset>

        <button type="submit" class="submit-btn">Sign up</button>
    </form>
</body>
</html>
